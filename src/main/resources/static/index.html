<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprout AI | 智能项目助手</title>
    <link rel="stylesheet" href="style.css">
    <!-- 图标仍然保留在标签页，但在列表中会移除 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <link href="https://cdn.bootcdn.net/ajax/libs/highlight.js/11.8.0/styles/atom-one-light.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <header class="header">
        <div class="header-content">
            <h1>🌱 Sprout AI</h1>
        </div>
        <div class="header-info">
            <span class="badge">IoC Core</span>
            <span class="badge">RAG Engine</span>
        </div>
    </header>

    <main class="main">
        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="message-avatar"><span>🌱</span></div>
                <div class="message-content">
                    <div class="message-text">
                        你好！我是 <strong>Sprout AI</strong> 项目助手。<br><br>
                        我可以为你提供以下帮助：<br>
                         <strong>规划学习路径</strong>：根据项目分支引导你逐步掌握源码。<br>
                         <strong>工具调用支持</strong>：
                        <ul>
                            <li>读取项目核心文件源码</li>
                            <li>查询 目前IoC 容器运行 Bean 信息</li>
                        </ul>
                        <br>
                        请告诉我你想了解什么？
                    </div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="userInput" class="input-box" placeholder="输入你的问题...（Shift+Enter 换行）" rows="1"></textarea>
                <button id="sendButton" class="send-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="input-hints">
                <span class="hint">️ 推荐学习路线</span>
                <span class="hint"> 查询 目前容器Bean 信息</span>
                <span class="hint"> 读取 ChatClient 源码</span>
                <label style="margin-left: auto; font-size: 13px; color: var(--text-gray); display: flex; align-items: center; gap: 4px; cursor: pointer;">
                    <input type="checkbox" id="useStream" checked> 流式响应
                </label>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/marked/9.1.2/marked.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
